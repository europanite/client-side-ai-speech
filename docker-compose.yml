name: client-side-speech-ai

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/app:/app
      - frontend_node_modules:/app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]

volumes:
  frontend_node_modules:
